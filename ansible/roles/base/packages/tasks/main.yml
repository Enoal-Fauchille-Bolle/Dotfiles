- name: Install Debian packages
  ansible.builtin.apt:
    name: "{{ apt_packages_shell + apt_packages_dev + apt_packages_tex + apt_packages_desktop }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Install packages from third-party repositories
  ansible.builtin.apt:
    name: "{{ apt_packages_third_party }}"
    state: present
  become: true

- name: Create the download cache
  ansible.builtin.file:
    path: "{{ download_cache }}"
    state: directory
    mode: '0755'

# get_url checks the checksum; apt cannot when it fetches a URL itself.
- name: Download upstream .deb packages that no repository provides
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ download_cache }}/{{ item.url | basename }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: '0644'
  loop: "{{ apt_debs }}"
  loop_control:
    label: "{{ item.url | basename }}"

- name: Install the upstream .deb packages
  ansible.builtin.apt:
    deb: "{{ download_cache }}/{{ item.url | basename }}"
  loop: "{{ apt_debs }}"
  loop_control:
    label: "{{ item.url | basename }}"
  become: true
