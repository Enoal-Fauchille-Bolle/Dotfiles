- name: Create the download cache and ~/.local/bin
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ download_cache }}"
    - "{{ user_home }}/.local/bin"

# get_url checks the checksum; unarchive alone cannot.
- name: Download sshm
  ansible.builtin.get_url:
    url: "https://github.com/Gu1llaum-3/sshm/releases/download/{{ sshm_version }}/sshm_Linux_x86_64.tar.gz"
    dest: "{{ download_cache }}/sshm-{{ sshm_version }}_Linux_x86_64.tar.gz"
    checksum: "sha256:{{ sshm_sha256 }}"
    mode: '0644'

- name: Install sshm (SSH connection manager)
  ansible.builtin.unarchive:
    src: "{{ download_cache }}/sshm-{{ sshm_version }}_Linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    include: [sshm]
    creates: /usr/local/bin/sshm
    mode: '0755'
  become: true

- name: Install QDiskInfo (disk health GUI)
  ansible.builtin.get_url:
    url: "https://github.com/edisionnano/QDiskInfo/releases/download/{{ qdiskinfo_version }}/QDiskInfo_X86_64"
    dest: /usr/local/bin/QDiskInfo
    checksum: "sha256:{{ qdiskinfo_sha256 }}"
    mode: '0755'
  become: true

- name: Download the release binaries
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ download_cache }}/{{ item.url | basename }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: '0644'
  loop: "{{ release_binaries }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unpack the release binaries
  ansible.builtin.unarchive:
    src: "{{ download_cache }}/{{ item.url | basename }}"
    dest: "{{ user_home }}/.local/bin"
    remote_src: yes
    include: ["{{ item.member }}"]
    extra_opts: ["--strip-components={{ item.strip | default(0) }}"]
    creates: "{{ user_home }}/.local/bin/{{ item.name }}"
    mode: '0755'
  loop: "{{ release_binaries }}"
  loop_control:
    label: "{{ item.name }}"
