# SHELL=/bin/sh: the installer only edits rc files for shells it knows, and
# .zshrc already exports BUN_INSTALL.
- name: Install bun
  ansible.builtin.shell: |
    curl -fsSL https://bun.sh/install | SHELL=/bin/sh bash -s -- "bun-v{{ bun_version }}"
  args:
    creates: "{{ user_home }}/.bun/bin/bun"
