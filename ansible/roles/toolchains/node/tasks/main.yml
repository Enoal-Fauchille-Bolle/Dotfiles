################################### mise ####################################
# mise comes from the Homebrew role, and the Node version from
# home/mise/.config/mise/config.toml, linked by the shell playbook.

- name: List what the global mise config still misses
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/mise ls --global --missing"
  args:
    chdir: "{{ user_home }}"
  register: mise_missing
  changed_when: false

- name: Install what the global mise config requests
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/mise install"
  args:
    chdir: "{{ user_home }}"
  when: mise_missing.stdout | length > 0

#################################### pnpm ###################################
# SHELL=/bin/sh: the installer only edits rc files for shells it knows, and
# .zshrc already exports PNPM_HOME.

- name: Install pnpm (standalone)
  ansible.builtin.shell: |
    curl -fsSL https://get.pnpm.io/install.sh | PNPM_VERSION={{ pnpm_version }} SHELL=/bin/sh ENV=/dev/null sh -
  args:
    creates: "{{ user_home }}/.local/share/pnpm/bin/pnpm"
  environment:
    PNPM_HOME: "{{ user_home }}/.local/share/pnpm"
