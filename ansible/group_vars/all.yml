  - podman
  - systemd-oomd
  - systemd-zram-generator
  - firmware-sof-signed
  - firmware-amd-graphics
  - dconf-cli
  - fontconfig
  - zenity
  - ffmpeg

# Third-party repositories, written in deb822 format under
# /etc/apt/sources.list.d/<name>.sources. signed_by is a URL, except for
# Claude Desktop whose key has no public URL: it is shipped in
# roles/base/repos/files.
apt_repositories:
  - name: docker
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/debian/gpg
  - name: tailscale
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
  - name: vscode
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  - name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
  - name: claude-desktop
    uris: https://downloads.claude.ai/claude-desktop/apt/stable
    suites: stable
    components: main
    signed_by: /usr/share/keyrings/claude-desktop-archive-keyring.asc

apt_packages_third_party:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - tailscale
  - code
  - gh
  - claude-desktop

# Packages that exist in no repository: installed from an upstream .deb.
# The checksums are the ones GitHub publishes for the assets.
apt_debs:
  - url: https://github.com/sezanzeb/input-remapper/releases/download/2.2.1/input-remapper-2.2.1.deb
    sha256: 6ad397c517a05cc001d45f821122d18506fe3f4d7bf1cb966b012cac54a949d2
  - url: https://github.com/JonMagon/KDiskMark/releases/download/3.3.0/kdiskmark_3.3.0_amd64.deb
    sha256: e6f372d42956eaf08e761f64b60fdd7402691bcd7ad4692ccabdd005e33eba33

################################## system ###################################

system_locale: en_US.UTF-8
system_timezone: Europe/Paris
keyboard_layout: fr
keyboard_variant: latin9
logind_handle_lid_switch: lock
logind_handle_power_key: suspend
sysctl_inotify_max_user_instances: 1024
grub_cmdline_linux_default: "quiet usb-storage.quirks=0bc2:231a:u,152d:0580:u"

user_groups:
  - sudo
  - docker
  - input
  - plugdev
  - netdev
  - bluetooth
  - lpadmin
  - scanner

################################### shell ###################################

ohmyzsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
ohmyzsh_plugins:
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
ohmyzsh_themes:
  - name: powerlevel10k
    repo: https://github.com/romkatv/powerlevel10k.git

################################ toolchains #################################

rust_components:
  - rust-src
cargo_crates:
  - { crate: atuin, bin: atuin }
  - { crate: git-delta, bin: delta }
  - { crate: cargo-tarpaulin, bin: cargo-tarpaulin }

pnpm_version: 11.17.0
bun_version: 1.3.14

homebrew_prefix: /home/linuxbrew/.linuxbrew
homebrew_formulae:
  - git
  - betterleaks
  - trufflehog
  - mise
# Brew binaries exposed system-wide, as on the laptop today.
homebrew_system_links:
  - git
  - betterleaks

pip_user_packages:
  - diff-cover
  - Pygments
uv_version: 0.12.17
# bin is the command that proves a tool is installed, when it differs from name.
uv_tools:
  - { name: claude-usage, source: "git+https://github.com/Enoal-Fauchille-Bolle/claude-usage" }
  - name: free-claude-code
    bin: fcc-server
    source: https://github.com/Alishahryar1/free-claude-code/archive/refs/heads/main.zip

# Each checksum belongs to the version above it: update both together. They come
# from dl.k8s.io and get.helm.sh, from the GitHub release assets, and for QDiskInfo,
# whose release publishes none, from a download of the asset.
kubectl_version: v1.36.3
kubectl_sha256: ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336
helm_version: v4.2.4
helm_sha256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
k9s_version: v0.51.0
k9s_sha256: c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7

sshm_version: v1.11.0
sshm_sha256: 8fbec778c28a403a4e8c43f58c476dfa09b66297df8429982ec79503b4cefa37
qdiskinfo_version: "0.4"
qdiskinfo_sha256: b0859706094dce364d2a20333b3e720808123caa7b35840fd2c536196b5b4b45

# Archives kept here are not downloaded again by the next run.
download_cache: "{{ user_home }}/.cache/dotfiles-downloads"

# Single binaries unpacked into ~/.local/bin. The checksum is the one GitHub
# publishes for the asset: update it with the version.
