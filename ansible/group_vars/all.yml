# Variables shared by every play. Removing an entry from a list only stops
# installing it on the next rebuild; nothing is ever uninstalled.

user_name: "{{ ansible_user_id }}"
user_home: "{{ ansible_env.HOME }}"
dotfiles_dir: "{{ user_home }}/Dotfiles"

# True inside a Docker/Podman/LXC test container. Skips what only makes sense
# on real hardware (GRUB, udev, sysctl) or needs a running session.
is_container: >-
  {{ ansible_virtualization_role | default('') == 'guest'
     and ansible_virtualization_type | default('') in ['docker', 'container', 'podman', 'lxc'] }}

#################################### apt ####################################

