################################# services ##################################

systemd_user_units_enabled:
  - sniper-mouse.service
  - battery-discord.timer
  - restic-backup.timer

# rustic only browses the restic repository (rustic-browse); restic keeps
# doing the backups. The checksum is the one GitHub publishes for the
# x86_64-unknown-linux-gnu archive of the release: update both together.
rustic_version: v0.11.4
rustic_sha256: c20bc3682c6275de3cfbc9317101dca5c0800a2fb5c610d0f9ef2addfd27cf81

# What restic-backup.sh sends to the repository, relative to the home
# directory. Only these paths are backed up; everything else (caches,
# ~/.config, tools the playbook reinstalls) is left out.
restic_include:
  - Documents
  - Projects
  - TermOxide
  - Downloads
  - Pictures
  - Videos
  - .claude
  - Dotfiles
  - .ssh
  - .gnupg
  - .zshrc.secrets
  - .kube
  - .docker
  - .wakatime.key
  - .local/share/keyrings
  - .zsh_history
  - .local/share/atuin
# Excluded inside the paths above. ** matches any depth, including none.
restic_exclude:
  - Projects/**/node_modules
  - Projects/**/target
  - Projects/**/dist
  - Projects/**/.venv
  - TermOxide/**/node_modules
  - TermOxide/**/target
  - TermOxide/**/dist
  - TermOxide/**/.venv
  - Downloads/**/*.iso
  # Outside every included path: listed to record that the Chrome profile
  # is left out on purpose.
  - .var/app/com.google.Chrome
