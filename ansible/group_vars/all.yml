  - firmware-amd-graphics
  - dconf-cli
  - fontconfig
  - zenity

# Third-party repositories, written in deb822 format under
# /etc/apt/sources.list.d/<name>.sources. signed_by is a URL, except for
# Claude Desktop whose key has no public URL: it is shipped in
# roles/base/repos/files.
apt_repositories:
  - name: docker
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/debian/gpg
  - name: tailscale
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
  - name: vscode
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  - name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
  - name: claude-desktop
    uris: https://downloads.claude.ai/claude-desktop/apt/stable
    suites: stable
    components: main
    signed_by: /usr/share/keyrings/claude-desktop-archive-keyring.asc

apt_packages_third_party:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - tailscale
  - code
  - gh
  - claude-desktop

# Packages that exist in no repository: installed from an upstream .deb.
apt_debs:
  - https://github.com/sezanzeb/input-remapper/releases/download/2.2.1/input-remapper-2.2.1.deb
  - https://github.com/JonMagon/KDiskMark/releases/download/3.3.0/kdiskmark_3.3.0_amd64.deb

################################## system ###################################

system_locale: en_US.UTF-8
system_timezone: Europe/Paris
keyboard_layout: fr
keyboard_variant: latin9
logind_handle_lid_switch: lock
sysctl_inotify_max_user_instances: 1024
grub_cmdline_linux_default: "quiet usb-storage.quirks=0bc2:231a:u,152d:0580:u"

user_groups:
  - sudo
  - docker
  - input
  - plugdev
  - netdev
  - bluetooth
  - lpadmin
  - scanner

################################### shell ###################################

ohmyzsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
ohmyzsh_plugins:
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
ohmyzsh_themes:
  - name: powerlevel10k
    repo: https://github.com/romkatv/powerlevel10k.git

################################ toolchains #################################

rust_components:
  - rust-src
cargo_crates:
  - { crate: atuin, bin: atuin }
  - { crate: git-delta, bin: delta }
  - { crate: cargo-tarpaulin, bin: cargo-tarpaulin }

nvm_version: v0.40.6
node_version: "24"
pnpm_version: 11.17.0
bun_version: 1.3.14

homebrew_prefix: /home/linuxbrew/.linuxbrew
homebrew_formulae:
  - git
  - betterleaks
  - trufflehog
# Brew binaries exposed system-wide, as on the laptop today.
homebrew_system_links:
  - git
  - betterleaks

pip_user_packages:
  - diff-cover
  - Pygments

kubectl_version: v1.36.3
helm_version: v4.2.4
k9s_version: v0.51.0

sshm_version: v1.11.0
qdiskinfo_version: "0.4"

claude_marketplaces:
