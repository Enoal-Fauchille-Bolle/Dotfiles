  - zsh-syntax-highlighting
  - fzf
  - eza
  - zoxide
  - thefuck
  - htop
  - btop
  - fastfetch
  - vim
  - tree
  - jq
  - curl
  - git
  - rsync
  - zip
  - unzip
  - zstd
  - xclip
  - wl-clipboard
  - stow
  - gnupg
  - netcat-traditional
  - nmap
  - usbutils
  - lshw
  - smartmontools
  - gsmartcontrol
  - evtest
  - acpica-tools
  - adb
  - mtp-tools
  - rclone
  - locales

apt_packages_dev:
