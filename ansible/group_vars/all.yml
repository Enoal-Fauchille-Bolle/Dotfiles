    url: https://github.com/BIRSAx2/mdcat/releases/download/mdcat-2.18.0/mdcat-2.18.0-x86_64-unknown-linux-gnu.tar.gz
    sha256: 7020f242175bdaa5dc9250e5564bfc8ae9099eadc66f4c38c9887b19cc046291
    member: mdcat-2.18.0-x86_64-unknown-linux-gnu/mdcat
    strip: 1
  - name: msgvault
    url: https://github.com/wesm/msgvault/releases/download/v0.20.0/msgvault_0.20.0_linux_amd64.tar.gz
    sha256: 6b99f03f41fe0b375f19b2f9202b35d72a11b30da1a51f50c48503b299305e0c
    member: msgvault
  - name: tuicr
    url: https://github.com/agavra/tuicr/releases/download/v0.27.0/tuicr-0.27.0-x86_64-unknown-linux-gnu.tar.gz
